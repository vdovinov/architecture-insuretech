# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale-test
  template:
    metadata:
      labels:
        app: scale-test
    spec:
      containers:
      - name: app
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "20Mi"
            cpu: "20m"
          limits:
            memory: "20Mi"
            cpu: "50m"